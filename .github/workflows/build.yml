name: Build Thunder Godot

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release name, e.g. 4.7.3-rc2 (before '-': upstream version, after: version status)"
        required: true
        default: "4.7.3-rc2"
      godot_ref:
        description: "Upstream Godot branch, tag or commit SHA to patch (branch = its latest commit)"
        required: true
        default: "4.7"
      build_name:
        description: "Custom build name appended to the version string"
        required: true
        default: "thunder"
      publish:
        description: "Create a GitHub release with the artifacts"
        type: boolean
        default: false
      release_tag:
        description: "Release tag (only used when publishing; default: the version)"
        required: false
  pull_request:
    paths: ["patches/**", "scripts/**", ".github/workflows/**"]

env:
  VERSION_NAME: ${{ inputs.version || '4.7.3-rc2' }}
  GODOT_REF: ${{ inputs.godot_ref || '4.7' }}
  BUILD_NAME: ${{ inputs.build_name || 'thunder' }}
  SCONS_CACHE_LIMIT: 4096
  # Build environment pinned to the 4.7 branches of godotengine/build-containers
  # and godot-build-scripts (Dockerfile.* / build.sh). Re-check on a new Godot branch.
  GODOT_SDK_VERSION: godot-2023.08.x-4
  ACCESSKIT_VERSION: "0.22.3"
  WINRT_RELEASE: "72"
  ANGLE_RELEASE: chromium%2F7578
  MESA_RELEASE: 25.3.1-3
  SCONS_VERSION: "4.10.1"
  # Android SDK packages, kept in sync with the 4.7 branch's
  # platform/android/java/app/config.gradle and platform/android/detect.py.
  ANDROID_HOME: /root/sdk
  ANDROID_SDK_ROOT: /root/sdk
  ANDROID_CMDLINE_TOOLS: commandlinetools-linux-13114758_latest.zip
  ANDROID_NDK_VERSION: "29.0.14206865"
  ANDROID_BUILD_TOOLS: "36.1.0"
  ANDROID_PLATFORM: android-36

jobs:
  check-patches:
    name: Check patches apply
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      status: ${{ steps.ver.outputs.status }}
      sha: ${{ steps.ver.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      # Resolve the ref once so every build job uses the same upstream commit.
      - run: scripts/prepare-source.sh "$GODOT_REF" "$RUNNER_TEMP/godot"
      - id: ver
        run: |
          echo "sha=$(git -C "$RUNNER_TEMP/godot" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(python3 scripts/godot-version.py "$RUNNER_TEMP/godot" "$VERSION_NAME" 2>/dev/null)" >> "$GITHUB_OUTPUT"
          python3 scripts/godot-version.py "$RUNNER_TEMP/godot" "$VERSION_NAME" >/dev/null   # surfaces errors
          echo "status=${VERSION_NAME#*-}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: check-patches
    runs-on: ubuntu-24.04
    # Same base image as godotengine/build-containers (Dockerfile.base).
    container: fedora:43
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux editor,             platform: linuxbsd, target: editor,           out: godot.linuxbsd.editor.x86_64 }
          - { name: Linux template debug,     platform: linuxbsd, target: template_debug,   out: godot.linuxbsd.template_debug.x86_64 }
          - { name: Linux template release,   platform: linuxbsd, target: template_release, out: godot.linuxbsd.template_release.x86_64 }
          - { name: Windows editor,           platform: windows,  target: editor,           out: godot.windows.editor.x86_64 }
          - { name: Windows template debug,   platform: windows,  target: template_debug,   out: godot.windows.template_debug.x86_64 }
          - { name: Windows template release, platform: windows,  target: template_release, out: godot.windows.template_release.x86_64 }
    steps:
      - name: Install base packages
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            bash binutils bzip2 curl file findutils gettext git make patch pkgconfig \
            python3-pip unzip which xz zip
          pip install scons==${SCONS_VERSION}

      - name: Install Linux toolchain (Godot buildroot SDK)
        if: matrix.platform == 'linuxbsd'
        run: |
          dnf -y install --setopt=install_weak_deps=False wayland-devel
          cd /root
          curl -fLO https://github.com/godotengine/buildroot/releases/download/${GODOT_SDK_VERSION}/x86_64-godot-linux-gnu_sdk-buildroot.tar.bz2
          tar xf x86_64-godot-linux-gnu_sdk-buildroot.tar.bz2
          rm -f x86_64-godot-linux-gnu_sdk-buildroot.tar.bz2
          (cd x86_64-godot-linux-gnu_sdk-buildroot && ./relocate-sdk.sh)
          echo "GODOT_SDK_LINUX_X86_64=/root/x86_64-godot-linux-gnu_sdk-buildroot" >> "$GITHUB_ENV"
          echo "/root/x86_64-godot-linux-gnu_sdk-buildroot/bin" >> "$GITHUB_PATH"

      - name: Install Windows toolchain (MinGW)
        if: matrix.platform == 'windows'
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            mingw64-gcc mingw64-gcc-c++ mingw64-winpthreads-static

      - name: Download third-party SDKs
        run: |
          mkdir -p /root/accesskit && cd /root/accesskit
          curl -fL -o accesskit.zip https://github.com/godotengine/godot-accesskit-c-static/releases/download/${ACCESSKIT_VERSION}/accesskit-c-${ACCESSKIT_VERSION}.zip
          unzip -o accesskit.zip && rm -f accesskit.zip
          mv accesskit-c-* accesskit-c
          if [ "${{ matrix.platform }}" = windows ]; then
            mkdir -p /root/winrt && cd /root/winrt
            curl -fL -o winrt.zip https://github.com/godotengine/winrt-mingw/releases/download/${WINRT_RELEASE}/winrt-headers.zip
            unzip -o winrt.zip && rm -f winrt.zip
            mkdir -p /root/angle && cd /root/angle
            curl -fL -o angle.zip https://github.com/godotengine/godot-angle-static/releases/download/${ANGLE_RELEASE}/godot-angle-static-x86_64-gcc-13-release.zip
            unzip -o angle.zip && rm -f angle.zip
            mkdir -p /root/mesa && cd /root/mesa
            curl -fL -o mesa.zip https://github.com/godotengine/godot-nir-static/releases/download/${MESA_RELEASE}/godot-nir-static-x86_64-gcc-release.zip
            unzip -o mesa.zip && rm -f mesa.zip
          fi

      - uses: actions/checkout@v4

      - name: Prepare patched source
        run: |
          git config --global --add safe.directory '*'
          scripts/prepare-source.sh "${{ needs.check-patches.outputs.sha }}" godot

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: godot/.scons_cache
          key: scons-${{ matrix.platform }}-${{ matrix.target }}-${{ env.GODOT_REF }}-${{ github.run_id }}
          restore-keys: |
            scons-${{ matrix.platform }}-${{ matrix.target }}-${{ env.GODOT_REF }}-

      - name: Build
        working-directory: godot
        env:
          SCONS_CACHE: ${{ github.workspace }}/godot/.scons_cache
          TERM: xterm
          BUILD_NAME: ${{ env.BUILD_NAME }}
          GODOT_VERSION_STATUS: ${{ needs.check-patches.outputs.status }}
        run: |
          # Flags as in godot-build-scripts (4.7 branch) build-{linux,windows}/build.sh
          SCONS="scons -j$(nproc) verbose=yes warnings=no progress=no redirect_build_objects=no"
          OPTIONS="production=yes accesskit_sdk_path=/root/accesskit/accesskit-c"
          if [ "${{ matrix.platform }}" = windows ]; then
            OPTIONS="$OPTIONS use_mingw=yes angle_libs=/root/angle mesa_libs=/root/mesa d3d12=yes winrt_path=/root/winrt"
          fi
          $SCONS platform=${{ matrix.platform }} arch=x86_64 $OPTIONS target=${{ matrix.target }}
          ls -l bin

      - name: Collect output
        run: |
          mkdir -p out
          cp -rvp godot/bin/* out/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  build-android:
    name: Android template (${{ matrix.arch }})
    needs: check-patches
    runs-on: ubuntu-24.04
    # Same base image as godotengine/build-containers (Dockerfile.android).
    container: fedora:43
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, arm32, x86_64, x86_32]
    steps:
      - name: Install base packages
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            bash binutils bzip2 curl file findutils gettext git make patch pkgconfig \
            python3-pip unzip which xz zip \
            java-21-openjdk-devel ncurses-compat-libs
          pip install scons==${SCONS_VERSION}

      - name: Install Android SDK/NDK
        run: |
          mkdir -p "$ANDROID_SDK_ROOT"
          cd "$ANDROID_SDK_ROOT"
          curl -fLO "https://dl.google.com/android/repository/${ANDROID_CMDLINE_TOOLS}"
          unzip -q "$ANDROID_CMDLINE_TOOLS"
          rm -f "$ANDROID_CMDLINE_TOOLS"
          yes | cmdline-tools/bin/sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null
          cmdline-tools/bin/sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "ndk;${ANDROID_NDK_VERSION}" "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platforms;${ANDROID_PLATFORM}" platform-tools > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Prepare patched source
        run: |
          git config --global --add safe.directory '*'
          scripts/prepare-source.sh "${{ needs.check-patches.outputs.sha }}" godot

      - name: Install Swappy frame pacing
        working-directory: godot
        run: python3 misc/scripts/install_swappy_android.py

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: godot/.scons_cache
          key: scons-android-${{ matrix.arch }}-${{ env.GODOT_REF }}-${{ github.run_id }}
          restore-keys: |
            scons-android-${{ matrix.arch }}-${{ env.GODOT_REF }}-

      - name: Build
        working-directory: godot
        env:
          SCONS_CACHE: ${{ github.workspace }}/godot/.scons_cache
          TERM: xterm
          BUILD_NAME: ${{ env.BUILD_NAME }}
          GODOT_VERSION_STATUS: ${{ needs.check-patches.outputs.status }}
        run: |
          # Flags as in godot-build-scripts (4.7 branch) build-android/build.sh
          SCONS="scons -j$(nproc) verbose=yes warnings=no progress=no redirect_build_objects=no"
          for target in template_release template_debug; do
            $SCONS platform=android arch=${{ matrix.arch }} production=yes swappy=yes target=$target
          done

      - uses: actions/upload-artifact@v4
        with:
          name: android-libs-${{ matrix.arch }}
          # Gradle packages whatever ABIs are present in debug/ and release/.
          path: godot/platform/android/java/lib/libs
          if-no-files-found: error

  android-templates:
    name: Android templates
    needs: [check-patches, build-android]
    runs-on: ubuntu-24.04
    container: fedora:43
    steps:
      - name: Install base packages
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            bash bzip2 curl file findutils git make patch python3-pip unzip which xz zip \
            java-21-openjdk-devel ncurses-compat-libs
          pip install scons==${SCONS_VERSION}

      - name: Install Android SDK/NDK
        run: |
          mkdir -p "$ANDROID_SDK_ROOT"
          cd "$ANDROID_SDK_ROOT"
          curl -fLO "https://dl.google.com/android/repository/${ANDROID_CMDLINE_TOOLS}"
          unzip -q "$ANDROID_CMDLINE_TOOLS"
          rm -f "$ANDROID_CMDLINE_TOOLS"
          yes | cmdline-tools/bin/sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null
          cmdline-tools/bin/sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "ndk;${ANDROID_NDK_VERSION}" "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platforms;${ANDROID_PLATFORM}" platform-tools > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Prepare patched source
        run: |
          git config --global --add safe.directory '*'
          scripts/prepare-source.sh "${{ needs.check-patches.outputs.sha }}" godot

      - uses: actions/download-artifact@v4
        with:
          pattern: android-libs-*
          path: androidlibs

      - name: Merge native libraries
        run: |
          mkdir -p godot/platform/android/java/lib/libs
          cp -r androidlibs/android-libs-*/debug androidlibs/android-libs-*/release \
            godot/platform/android/java/lib/libs/
          find godot/platform/android/java/lib/libs -name '*.so' | sort

      - name: Generate templates
        working-directory: godot/platform/android/java
        run: ./gradlew --no-daemon generateGodotTemplates

      - name: Collect output
        run: |
          mkdir -p out
          cp godot/bin/android_debug.apk godot/bin/android_release.apk godot/bin/android_source.zip out/
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: android-templates
          path: out/*
          if-no-files-found: error

  package:
    name: Package
    needs: [check-patches, build, android-templates]
    runs-on: ubuntu-24.04
    env:
      # Template version (version.txt): major.minor.patch.status, no build name
      TEMPLATES_VERSION: ${{ needs.check-patches.outputs.version }}
      UPSTREAM_SHA: ${{ needs.check-patches.outputs.sha }}
      BASENAME: Godot_v${{ inputs.version || '4.7.3-rc2' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble archives
        run: |
          set -e
          mkdir -p dist tpz/templates stage
          a=$PWD/artifacts

          # Export templates (layout of godot-build-scripts/build-release.sh)
          curl -fL -o tpz/templates/icudt_godot.dat \
            "https://raw.githubusercontent.com/godotengine/godot/${UPSTREAM_SHA}/thirdparty/icu4c/icudt_godot.dat"
          echo "$TEMPLATES_VERSION" > tpz/templates/version.txt
          for t in debug release; do
            cp $a/linuxbsd-template_$t/godot.linuxbsd.template_$t.x86_64 tpz/templates/linux_$t.x86_64
            src=$a/windows-template_$t/godot.windows.template_$t.x86_64
            cp $src.exe         tpz/templates/windows_${t}_x86_64.exe
            cp $src.console.exe tpz/templates/windows_${t}_x86_64_console.exe
          done
          cp $a/android-templates/android_debug.apk \
             $a/android-templates/android_release.apk \
             $a/android-templates/android_source.zip tpz/templates/
          (cd tpz && zip -q -9 -r -D "../dist/${BASENAME}_export_templates.zip" templates/*)

          # Editors
          cd stage
          cp $a/linuxbsd-editor/godot.linuxbsd.editor.x86_64 ${BASENAME}_linux.x86_64
          chmod +x ${BASENAME}_linux.x86_64
          zip -q -9 "../dist/${BASENAME}_linux.x86_64.zip" ${BASENAME}_linux.x86_64
          cp $a/windows-editor/godot.windows.editor.x86_64.exe         ${BASENAME}_win64.exe
          cp $a/windows-editor/godot.windows.editor.x86_64.console.exe ${BASENAME}_win64_console.exe
          zip -q -9 "../dist/${BASENAME}_win64.exe.zip" ${BASENAME}_win64.exe ${BASENAME}_win64_console.exe

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.BASENAME }}
          path: dist/*

      - name: Publish release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.release_tag }}"
          [ -n "$tag" ] || tag="$VERSION_NAME"
          flags=""
          case "$VERSION_NAME" in *-stable) ;; *) flags="--prerelease" ;; esac
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" $flags \
            --target "$GITHUB_SHA" --title "$tag" \
            --notes "Upstream: [godotengine/godot@${UPSTREAM_SHA::10}](https://github.com/godotengine/godot/commit/${UPSTREAM_SHA}) (\`$GODOT_REF\`)"
    permissions:
      contents: write
